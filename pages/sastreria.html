<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sastrería - Farmers de Azeroth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { wow: { dark: "#0b0c10", card: "#1a1d29", border: "#2a2e3b", gold: "#ffd100" } } } }
      };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-wow-dark text-gray-300 min-h-screen flex flex-col">
    <div id="header-container" class="sticky top-0 z-50"></div>
    <main class="flex-grow flex items-center justify-center px-4">
        <div class="bg-wow-card border border-wow-border rounded-xl px-16 py-12 text-center">
            <h3 class="text-xl font-bold text-white">Contenido en Construcción</h3>
            <p class="text-gray-400 mt-2">Estamos trabajando en esta sección.</p>
            <a href="profesiones.html" class="inline-flex items-center gap-2 mt-6 text-sm text-gray-500 hover:text-white transition-colors">
                <i class="fas fa-arrow-left text-xs"></i> Volver
            </a>
        </div>
    </main>
    <script>
        fetch('/components/header.html').then(r=>r.text()).then(d=>{
            document.getElementById('header-container').innerHTML=d;
            const s=document.getElementById('header-container').getElementsByTagName('script');
            for(let i=0;i<s.length;i++) eval(s[i].innerText);
        });
    </script>
</body>
</html>
